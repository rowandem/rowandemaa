<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rowan de Maa — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&family=Instrument+Serif:ital@0;1&family=GT+Sectra&family=Space+Grotesk:wght@300;400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f7f6f2; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes marqueeB { from { transform: translateX(0); } to { transform: translateX(-33.333%); } }
  button:focus-visible, a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .va-main img { cursor: zoom-in; }
  .va-main button img { cursor: pointer; }

  /* Responsive overrides */
  .va-case-meta { clear: both; }
  @media (max-width: 1024px) {
    .va-header  { padding-left: 48px !important; padding-right: 48px !important; }
    .va-main    { padding-left: 48px !important; padding-right: 48px !important; }
    .va-footer  { padding-left: 48px !important; padding-right: 48px !important; }
  }
  @media (max-width: 768px) {
    .va-header  { padding-left: 24px !important; padding-right: 24px !important; padding-top: 20px !important; }
    .va-main    { padding-left: 24px !important; padding-right: 24px !important; padding-top: 28px !important; }
    .va-footer  { padding-left: 24px !important; padding-right: 24px !important; }
    .va-nameplate { margin-top: 60px !important; }
    .va-topbar  { flex-wrap: wrap !important; row-gap: 10px !important; }
    .va-nav     { gap: 16px !important; font-size: 12px !important; }
    .va-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 14px !important; }
    .va-case-meta { grid-template-columns: repeat(2, 1fr) !important; }
    .va-case-section { grid-template-columns: 1fr !important; gap: 12px !important; }
    .va-cv-row { grid-template-columns: 1fr !important; gap: 8px !important; }
    .va-cv-loc { text-align: left !important; }
    .va-cv-skills-langs { grid-template-columns: 1fr !important; }
    .va-about-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
    .va-phone-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .va-photo-grid { grid-template-columns: 1fr !important; }
    .va-filter-bar { flex-direction: column !important; align-items: flex-start !important; }
  }
  @media (max-width: 480px) {
    .va-header  { padding-left: 16px !important; padding-right: 16px !important; }
    .va-main    { padding-left: 16px !important; padding-right: 16px !important; }
    .va-footer  { padding-left: 16px !important; padding-right: 16px !important; flex-direction: column !important; gap: 12px !important; }
    .va-nav     { gap: 12px !important; font-size: 11px !important; }
    .va-grid { grid-template-columns: 1fr !important; }
    .va-nameplate { margin-top: 40px !important; }
    .va-case-meta { grid-template-columns: 1fr 1fr !important; }
    .va-phone-grid { grid-template-columns: 1fr 1fr !important; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#2A2A2E"/><text x="150" y="150" dy="0.35em" text-anchor="middle" font-family="Quicksand, sans-serif" font-size="150" font-weight="600" fill="#EFE7DD">R</text></svg></template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="thumbs.jsx"></script>
<script type="text/babel" src="lightbox.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="variant-a.jsx"></script>
<script type="text/babel" src="flipped-out-case.jsx"></script>
<script type="text/babel" src="drawings-case.jsx"></script>
<script type="text/babel" src="drawings19-case.jsx"></script>
<script type="text/babel" src="stibat-case.jsx"></script>
<script type="text/babel" src="weartodare-case.jsx"></script>
<script type="text/babel" src="socials-case.jsx"></script>
<script type="text/babel" src="thunderstorm-case.jsx"></script>
<script type="text/babel" src="energyzero-case.jsx"></script>
<script type="text/babel" src="keiretsu-case.jsx"></script>
<script type="text/babel" src="vibe-coding-case.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "cols": 3,
  "tileAspect": "4\/5",
  "bgMode": "cream",
  "fontSerif": "Quicksand",
  "fontSans": "Inter",
  "headerAlign": "center"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <VariantA tweaks={tweaks} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Layout">
          <TweakRadio label="Grid columns" value={tweaks.cols}
            onChange={v => setTweak("cols", v)}
            options={[{label:"2", value:2},{label:"3", value:3},{label:"4", value:4}]}/>
          <TweakSelect label="Tile aspect" value={tweaks.tileAspect}
            onChange={v => setTweak("tileAspect", v)}
            options={[
              {label:"4 : 5  (portrait)", value:"4/5"},
              {label:"1 : 1  (square)",   value:"1/1"},
              {label:"4 : 3  (landscape)", value:"4/3"},
              {label:"3 : 4",             value:"3/4"},
            ]}/>
          <TweakRadio label="Header align" value={tweaks.headerAlign}
            onChange={v => setTweak("headerAlign", v)}
            options={[{label:"Left", value:"left"},{label:"Center", value:"center"}]}/>
        </TweakSection>

        <TweakSection label="Color">
          <TweakRadio label="Background" value={tweaks.bgMode}
            onChange={v => setTweak("bgMode", v)}
            options={[
              {label:"White", value:"white"},
              {label:"Cream", value:"cream"},
              {label:"Dark",  value:"dark"},
            ]}/>
        </TweakSection>

        <TweakSection label="Type">
          <TweakSelect label="Display serif" value={tweaks.fontSerif}
            onChange={v => setTweak("fontSerif", v)}
            options={[
              {label:"Quicksand",         value:"Quicksand"},
              {label:"DM Serif Display",  value:"DM Serif Display"},
              {label:"Instrument Serif",  value:"Instrument Serif"},
              {label:"GT Sectra",         value:"GT Sectra"},
            ]}/>
          <TweakSelect label="Body sans" value={tweaks.fontSans}
            onChange={v => setTweak("fontSans", v)}
            options={[
              {label:"Inter",         value:"Inter"},
              {label:"Space Grotesk", value:"Space Grotesk"},
              {label:"Geist",         value:"Geist"},
            ]}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
